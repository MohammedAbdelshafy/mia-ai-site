name: Mia waitlist safety checks
on:
  pull_request:
    paths:
      - 'server/**'
      - 'assets/site.js'
      - '.github/workflows/mia-waitlist-ci.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server/index.js
      - run: node --check assets/site.js
      - run: node --test server/test/*.test.js
